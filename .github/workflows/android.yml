name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee build.log
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          cp app/build/outputs/apk/release/app-release.apk "ShortsMaker-$VERSION.apk"
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest "ShortsMaker-$VERSION.apk" --prerelease --target "$GITHUB_SHA" --title "ShortsMaker $VERSION" --notes "Built from $GITHUB_SHA"
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@localhost
          grep -E "error:|warning: \[|FAILED|What went wrong|\.java:[0-9]+" -A3 build.log | head -400 > errors.txt || true
          git checkout --orphan ci-log
          git rm -rf --cached . >/dev/null
          git add -f errors.txt build.log
          git commit -m "build log $GITHUB_SHA" >/dev/null
          git push -f origin ci-log
